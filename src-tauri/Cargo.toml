[package]
name = "tablet-shot-bridge"
version = "0.1.5"
description = "Windows screenshot and media remote bridge for Android tablets"
authors = ["OZ"]
edition = "2021"

[lib]
name = "tablet_shot_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
enigo = "0.2"
futures-util = "0.3"
gethostname = "0.5"
image = "0.24"
local-ip-address = "0.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
screenshots = "0.8"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.jpeg-decoder]
opt-level = 3
